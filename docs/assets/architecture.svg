<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="t d">
  <title id="t">Arquitetura e decisões</title>
  <desc id="d">Faixa de título do documento de arquitetura com um bilhete resumindo as garantias: lock por wallet, idempotência por chave, hash e inbox, outbox com SKIP LOCKED e o schema como última defesa.</desc>
