name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# read-only token: the jobs only check out code and run tests and a build
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests (PostgreSQL + LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Start PostgreSQL and LocalStack
        run: docker compose up -d --wait postgres localstack

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Migrate
        run: bun run migrate

      - name: Unit and property tests
        run: bun run test:unit

      - name: Integration tests
        run: bun run test:integration

      - name: Concurrency and multi-instance tests
        run: bun run test:concurrency

      - name: Resilience tests (PostgreSQL crash, SQS freeze)
        run: bun run test:resilience

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres localstack

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t wagering-processor:ci .
